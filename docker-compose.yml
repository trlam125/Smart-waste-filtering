services:
  waste-scanner:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - waste-data:/app/data
      - ./models:/app/models:ro
    environment:
      DATABASE_PATH: /app/data/waste_scanner.db
      WASTE_MODEL_CHECKPOINT: /app/models/best_model.pt
      WASTE_DEVICE: ${WASTE_DEVICE:-cpu}
      UNKNOWN_THRESHOLD: ${UNKNOWN_THRESHOLD:-0.60}
      UNCERTAINTY_MARGIN: ${UNCERTAINTY_MARGIN:-0.10}
      MODEL_RETRY_SECONDS: ${MODEL_RETRY_SECONDS:-10}
      PRELOAD_MODEL: ${PRELOAD_MODEL:-true}
      CLASSIFIER_IMAGE_MAX_DIMENSION: ${CLASSIFIER_IMAGE_MAX_DIMENSION:-1024}
      MAX_IMAGE_PIXELS: ${MAX_IMAGE_PIXELS:-20000000}
      HISTORY_DELETE_PASSWORD: ${HISTORY_DELETE_PASSWORD:-}
      SQLITE_BUSY_TIMEOUT_MS: ${SQLITE_BUSY_TIMEOUT_MS:-5000}
      SQLITE_JOURNAL_MODE: ${SQLITE_JOURNAL_MODE:-DELETE}
      SCAN_THUMBNAIL_DIR: ${SCAN_THUMBNAIL_DIR:-}
      THUMBNAIL_MAX_DIMENSION: ${THUMBNAIL_MAX_DIMENSION:-480}
      THUMBNAIL_JPEG_QUALITY: ${THUMBNAIL_JPEG_QUALITY:-80}
      FEEDBACK_LEARNING_ENABLED: ${FEEDBACK_LEARNING_ENABLED:-true}
      LEARNING_MAX_EXAMPLES: ${LEARNING_MAX_EXAMPLES:-500}
      LEARNING_TOP_K: ${LEARNING_TOP_K:-5}
      LEARNING_MIN_SIMILARITY: ${LEARNING_MIN_SIMILARITY:-0.84}
      LEARNING_MAX_WEIGHT: ${LEARNING_MAX_WEIGHT:-0.60}
      LEARNING_SINGLE_EXAMPLE_FACTOR: ${LEARNING_SINGLE_EXAMPLE_FACTOR:-0.78}
      LEARNING_CERTAINTY_MIN_EXAMPLES: ${LEARNING_CERTAINTY_MIN_EXAMPLES:-3}
      LEARNING_CERTAINTY_MIN_AGREEMENT: ${LEARNING_CERTAINTY_MIN_AGREEMENT:-0.75}
      LEARNING_CERTAINTY_MIN_SIMILARITY: ${LEARNING_CERTAINTY_MIN_SIMILARITY:-0.92}
      LEARNING_DUPLICATE_SIMILARITY: ${LEARNING_DUPLICATE_SIMILARITY:-0.995}
    restart: unless-stopped

  ngrok:
    image: ngrok/ngrok:alpine
    profiles: ["ngrok"]
    depends_on:
      - waste-scanner
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
      NGROK_DOMAIN: ${NGROK_DOMAIN:-}
      NGROK_BASIC_AUTH: ${NGROK_BASIC_AUTH:-}
    volumes:
      - ./ngrok_docker_entrypoint.sh:/opt/ngrok-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/opt/ngrok-entrypoint.sh"]
    ports:
      - "4040:4040"
    restart: unless-stopped

volumes:
  waste-data:
