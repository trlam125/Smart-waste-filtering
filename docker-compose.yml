services:
  waste-scanner:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - waste-data:/app/data
      - model-cache:/root/.cache/huggingface
    environment:
      DATABASE_PATH: /app/data/waste_scanner.db
      SCAN_THUMBNAIL_DIR: ${SCAN_THUMBNAIL_DIR:-}
      MIGRATE_LEGACY_THUMBNAILS: ${MIGRATE_LEGACY_THUMBNAILS:-false}
      THUMBNAIL_MAX_DIMENSION: ${THUMBNAIL_MAX_DIMENSION:-480}
      THUMBNAIL_JPEG_QUALITY: ${THUMBNAIL_JPEG_QUALITY:-80}
      WASTE_MODEL: ${WASTE_MODEL:-openai/clip-vit-base-patch32}
      UNKNOWN_THRESHOLD: ${UNKNOWN_THRESHOLD:-0.24}
      UNCERTAINTY_MARGIN: ${UNCERTAINTY_MARGIN:-0.05}
      CENTER_CROP_ENABLED: ${CENTER_CROP_ENABLED:-true}
      CENTER_CROP_WIDTH_RATIO: ${CENTER_CROP_WIDTH_RATIO:-0.72}
      CENTER_CROP_HEIGHT_RATIO: ${CENTER_CROP_HEIGHT_RATIO:-0.86}
      WIDE_CROP_ENABLED: ${WIDE_CROP_ENABLED:-true}
      WIDE_CROP_WIDTH_RATIO: ${WIDE_CROP_WIDTH_RATIO:-0.96}
      WIDE_CROP_HEIGHT_RATIO: ${WIDE_CROP_HEIGHT_RATIO:-0.62}
      SECONDARY_CROP_WIDTH_RATIO: ${SECONDARY_CROP_WIDTH_RATIO:-0.88}
      SECONDARY_CROP_HEIGHT_RATIO: ${SECONDARY_CROP_HEIGHT_RATIO:-0.74}
      ROTATION_ENSEMBLE_ENABLED: ${ROTATION_ENSEMBLE_ENABLED:-true}
      OBJECT_VIEW_TOP_K: ${OBJECT_VIEW_TOP_K:-2}
      OBJECT_PROMPT_TOP_K: ${OBJECT_PROMPT_TOP_K:-2}
      PROMPT_SCORE_TOP_K: ${PROMPT_SCORE_TOP_K:-2}
      OBJECT_PRIOR_WEIGHT: ${OBJECT_PRIOR_WEIGHT:-0.55}
      MATERIAL_PRIMARY_WEIGHT: ${MATERIAL_PRIMARY_WEIGHT:-0.60}
      MATERIAL_SECONDARY_WEIGHT: ${MATERIAL_SECONDARY_WEIGHT:-0.25}
      MATERIAL_FULL_WEIGHT: ${MATERIAL_FULL_WEIGHT:-0.15}
      PAPER_PLASTIC_GUARD_ENABLED: ${PAPER_PLASTIC_GUARD_ENABLED:-true}
      PAPER_PLASTIC_OBJECT_WEIGHT: ${PAPER_PLASTIC_OBJECT_WEIGHT:-0.72}
      PAPER_PLASTIC_OBJECT_MARGIN: ${PAPER_PLASTIC_OBJECT_MARGIN:-0.08}
      STAGE_DISAGREEMENT_MARGIN: ${STAGE_DISAGREEMENT_MARGIN:-0.08}
      MODEL_RETRY_SECONDS: ${MODEL_RETRY_SECONDS:-30}
      PRELOAD_MODEL: ${PRELOAD_MODEL:-true}
      CLASSIFIER_IMAGE_MAX_DIMENSION: ${CLASSIFIER_IMAGE_MAX_DIMENSION:-1024}
      MAX_IMAGE_PIXELS: ${MAX_IMAGE_PIXELS:-20000000}
      SQLITE_BUSY_TIMEOUT_MS: ${SQLITE_BUSY_TIMEOUT_MS:-5000}
      FEEDBACK_LEARNING_ENABLED: ${FEEDBACK_LEARNING_ENABLED:-true}
      LEARNING_MAX_EXAMPLES: ${LEARNING_MAX_EXAMPLES:-500}
      LEARNING_TOP_K: ${LEARNING_TOP_K:-5}
      LEARNING_MIN_SIMILARITY: ${LEARNING_MIN_SIMILARITY:-0.84}
      LEARNING_SCORE_MIN_SIMILARITY: ${LEARNING_SCORE_MIN_SIMILARITY:-0.96}
      LEARNING_MAX_WEIGHT: ${LEARNING_MAX_WEIGHT:-0.60}
      LEARNING_SINGLE_EXAMPLE_FACTOR: ${LEARNING_SINGLE_EXAMPLE_FACTOR:-0.78}
      LEARNING_DISAGREEMENT_OVERRIDE_WEIGHT: ${LEARNING_DISAGREEMENT_OVERRIDE_WEIGHT:-0.20}
    restart: unless-stopped

  ngrok:
    image: ngrok/ngrok:alpine
    profiles: ["ngrok"]
    depends_on:
      - waste-scanner
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
      NGROK_DOMAIN: ${NGROK_DOMAIN:-}
      NGROK_BASIC_AUTH: ${NGROK_BASIC_AUTH:-}
    volumes:
      - ./ngrok_docker_entrypoint.sh:/opt/ngrok-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/opt/ngrok-entrypoint.sh"]
    ports:
      - "4040:4040"
    restart: unless-stopped

volumes:
  waste-data:
  model-cache:
